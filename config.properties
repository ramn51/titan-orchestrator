# Titan Configuration
titan.redis.host=localhost
titan.redis.port=6379
titan.worker.heartbeat.interval=10
# Concurrent jobs accepted by each worker. Change while the worker is stopped.
titan.worker.slots=4
# Pin the fleet for controlled benchmarks by setting this to false before master start.
titan.scheduler.autoscale=true
titan.scheduler.max.workers=5
