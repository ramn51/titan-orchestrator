name: Deploy Docs

# Auto-deploy the MkDocs site to the gh-pages branch whenever docs change.
on:
  push:
    branches: [master]
    paths:
      - 'titan-docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:   # allows manual runs from the Actions tab

permissions:
  contents: write       # lets the built-in GITHUB_TOKEN push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so gh-deploy can update gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - run: pip install -r titan-docs/requirements.txt

      - name: Build and deploy
        run: mkdocs gh-deploy --force --clean -f titan-docs/mkdocs.yml
