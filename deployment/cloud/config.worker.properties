# Concurrent jobs accepted by this worker. Start at two for a 2-vCPU VM.
titan.worker.slots=2
titan.worker.heartbeat.interval=10

# Fleet scaling is controlled by the Master VM.
titan.scheduler.autoscale=false
titan.scheduler.max.workers=1

titan.logging.job.events=false
titan.logging.protocol=false
titan.logging.worker.registration=false
